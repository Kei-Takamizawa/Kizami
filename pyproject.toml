[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kizami"
version = "0.0.1"
description = "Onset-synced timed lyrics generator for Japanese songs (work in progress)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.26"]
generate = [
    "numpy>=1.26",
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "safetensors>=0.4",
    "sudachipy>=0.6.8",
    "sudachidict_core>=20240409",
]
dev = ["pytest>=8", "numpy>=1.26"]

[project.scripts]
kizami = "kizami.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kizami = ["tagger/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
